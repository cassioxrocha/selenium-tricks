services:
  web:
    image: selenium_bg
    build: .
    volumes:
      - ./files:/python-docker/files
      - ./downloads:/tmp/downloads
      - ./downloads:/downloads
    ports:
      - "8000:5000"
  selenium:
    image: selenium/standalone-firefox:latest
    volumes:
      - ./downloads:/home/seluser/Downloads
      - ./downloads:/tmp/downloads
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_SESSION_TIMEOUT=300
    shm_size: 2gb

